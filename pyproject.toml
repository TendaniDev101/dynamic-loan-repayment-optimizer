[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-loan-repayment-optimizer"
version = "0.1.0"
description = "Loan repayment optimizer adapted for Cloudflare Workers"
requires-python = ">=3.12"
dependencies = []


[dependency-groups]
dev = [
  "workers-py>=1.9.0",
  "workers-runtime-sdk>=1.1.4",
]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["backend.tests*"]
